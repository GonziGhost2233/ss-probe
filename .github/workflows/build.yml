name: build-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          mkdir out
          javac --release 8 -d out Probe.java
          echo "Main-Class: Probe" > manifest.txt
          jar cfm probe.jar manifest.txt -C out .
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe.jar
